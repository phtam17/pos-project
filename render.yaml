previews:
  generation: off

services:
  - type: web
    name: varipos-sandbox
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    preDeployCommand: npm run db:prepare
    healthCheckPath: /ready
    numInstances: 1
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: sandbox
      - key: PUBLIC_SANDBOX
        value: "true"
      - key: PUBLIC_STAFF_LOGIN_ENABLED
        value: "false"
      - key: HOST
        value: 0.0.0.0
      - key: STATIC_DIR
        value: /app/apps/register/dist
      - key: CORS_ORIGINS
        value: ""
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: PERSISTENCE_MODE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: varipos-postgres
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: SIMULATED_WEBHOOK_SECRET
        generateValue: true
      - key: SANDBOX_AUTH_ENABLED
        value: "true"
      - key: SESSION_DURATION_MINUTES
        value: "60"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_MAX
        value: "300"
      - key: LOGIN_RATE_LIMIT_MAX
        value: "30"
      - key: DEMO_RESET_ENABLED
        value: "true"
      - key: DEMO_RESET_INTERVAL_MINUTES
        value: "60"

databases:
  - name: varipos-postgres
    plan: free
    region: oregon
    postgresMajorVersion: "17"
    databaseName: varipos
    user: varipos
    ipAllowList: []
