name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pos
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pos -d pos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgres://pos:pos@localhost:5433/pos
      - run: npm run db:seed
        env:
          DATABASE_URL: postgres://pos:pos@localhost:5433/pos
      - run: npm run smoke:postgres
        env:
          DATABASE_URL: postgres://pos:pos@localhost:5433/pos

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag varipos:ci .
      - name: Smoke test production container
        run: |
          set -eu
          container_id=$(docker run --detach --publish 3001:3000 --env PERSISTENCE_MODE=memory varipos:ci)
          trap 'docker rm --force "$container_id"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3001/ready >/dev/null
          curl --fail --silent http://127.0.0.1:3001/ | grep --quiet "VariPOS"
